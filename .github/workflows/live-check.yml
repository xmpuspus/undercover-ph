# The daily rebuild only proves that a commit reached main. A failed Vercel build keeps
# the old deployment up, and its 7 shade dates run out within a week with no alert.
# This job reads every area's live manifest after the rebuild window and opens an issue when
# an area's first shade date is not today (Manila) or its shade marker is gone. A failed rebuild
# then shows the next morning, with about 6 days of old data left to fix it.

name: live-check

on:
  schedule:
    - cron: "10 23 * * *" # 07:10 Asia/Manila, 90 minutes after daily-rebuild
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: the live shade dates start today
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the live manifest and the shade marker
        env:
          SITE: https://undercover.ph
        run: |
          python3 - <<'EOF'
          import json, os, sys, time, urllib.request
          from datetime import datetime, timedelta, timezone

          site = os.environ["SITE"]
          today = datetime.now(timezone(timedelta(hours=8))).date().isoformat()

          def get(path):
              req = urllib.request.Request(f"{site}{path}?cb={int(time.time())}", headers={"Cache-Control": "no-cache"})
              with urllib.request.urlopen(req, timeout=30) as res:
                  return res.headers.get("content-type", ""), res.read()

          # Every area has its own manifest and shade marker since the app moved to areas on 2026-10-22.
          _, body = get("/data/areas.json")
          ids = [a["id"] for a in json.loads(body)["areas"]]
          stale = []
          for i in ids:
              _, body = get(f"/data/areas/{i}/manifest.json")
              dates = json.loads(body).get("dates") or []
              kind, _ = get(f"/data/areas/{i}/READY.shade")
              print(f"{i}: dates {dates[:1]} to {dates[-1:]}")
              if not dates or dates[0] != today or "text/html" in kind:
                  stale.append(f"{i} starts {dates[:1]}" if "text/html" not in kind else f"{i} has no READY.shade")
          if stale:
              sys.exit(f"Not today ({today}) in {len(stale)} of {len(ids)} areas: {', '.join(stale)}. The last daily rebuild did not deploy.")
          print("live data is current")
          EOF

  report-failure:
    name: open an issue
    needs: check
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open an issue with the run link
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" \
            --title "Live site data is stale $(TZ=Asia/Manila date +%F)" \
            --body "The live-check workflow found that undercover.ph does not serve today's shade data: $RUN_URL. Check the latest Vercel build log for the Python data step."
