# Unit tests and the app build on every push to main and every pull request.
# The Playwright flow in app/e2e is not run here: it needs the generated data
# (manifest.json, shade.bin, overlays), which only the Vercel build creates.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: app (vitest + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Unit tests (the real-data router tests skip without generated data)
        run: pnpm test
      - name: Build
        run: pnpm build

  shade:
    name: shade engine (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/shade/requirements.txt
      - name: Install pinned requirements
        run: python -m pip install -r pipeline/shade/requirements.txt
      - name: Shade tests
        working-directory: pipeline/shade
        run: python -m pytest test_shade.py -q

  access:
    name: pedestrian access rules (unittest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - name: Install pinned requirements
        run: python -m pip install -r pipeline/requirements.txt
      - name: Access rule tests
        run: python -m unittest tests/test_pedestrian_access.py -v
